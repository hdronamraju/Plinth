# Every document in the knowledge lake. One entry per source file.
#
# id         stable key; used in folder names and citations (never reuse or rename)
# kind       code | charter | policy | guideline | form | precedent
# authority  how much weight an answer may give it:
#              binding     adopted law (Charter, City Code)
#              official    city-published policy, guideline or form
#              staff       a planner's written answer (see knowledge/precedent/)
# effective  effective date shown by the city, or null if none is shown
# url        where the city publishes it (fetched by tools/ingest.py)
#
