# Eval set seeded from the 21 Lorita Avenue thread (PLAN.md §8), corrected after checking
# the vault. See the header of general.yaml for the schema and grading rules.
#
# Goal and scoring: see README.md (correct answer > escalate > confident wrong).
#
# PRECEDENT IS OUT OF SCOPE for these evals (entries marked uses_precedent: true). Questions that
# only staff precedent could answer are must_escalate (abstain: true). Mixed ones (L1, L8, L13)
# answer only what the code or guidelines support and escalate the rest. The agent must never say
# that staff have said nothing or that no precedent exists; "Needs staff" is the correct answer.
# L9 is also must_escalate; L6b and L10 are mixed.
#
# Labels: code | policy | needs_staff
# Corrections vs PLAN.md: #6 split by new-vs-conversion; #10 zone is not in the vault, only the
# 20 ft street yard is. The 21 Lorita precedent records still exist in knowledge/precedent/.

- id: L1
  question: "Can I replace a window with a same-size double-pane window on the part of the house over the property line?"
  uses_precedent: true
  expect_label: [policy, needs_staff]
  must_cite: [design-guidelines:p022, policy-window-replacement:p001]
  gist: "Answer what the guidelines support: Guidelines 2.05 item 32 exempts replacing an existing WOOD window with wood having aluminum or fiberglass cladding if size/location, operation, recess and divided lite pattern (true or 3-D simulated) are unchanged; window policy items 5 and 7. Escalate whether the same applies to the part of the house over the property line. Must not state what staff have or have not said."
  must_not: ["no staff precedent", "no precedent", "approved"]

- id: L2
  question: "Can I put a smaller window in the existing opening over the property line?"
  uses_precedent: true
  must_not: ["no staff precedent", "no precedent", "approved"]
  abstain: true
  expect_label: [needs_staff]
  gist: "Escalate. Whether a smaller window in an existing opening over the property line is allowed is a staff determination; the code and guidelines do not address it. Must not state what staff have or have not said."
  property_scoped: true
- id: L3
  question: "Can I do interior work in the portion of the building over the property line?"
  uses_precedent: true
  must_not: ["no staff precedent", "no precedent", "approved"]
  abstain: true
  expect_label: [needs_staff]
  gist: "Escalate. Whether interior work is allowed in a portion of the building over the property line is a staff determination; the code and guidelines do not address it. Must not state what staff have or have not said."
  property_scoped: true
- id: L4
  question: "How do I count FAR and lot coverage for a structure that crosses the property line?"
  uses_precedent: true
  must_not: ["no staff precedent", "no precedent", "approved"]
  abstain: true
  expect_label: [needs_staff]
  gist: "Escalate. May quote the 17.90.020 floor area definition as context, but must not state how a portion over the property line is counted for FAR, lot coverage or landscape coverage; that is a staff determination. Must not state what staff have or have not said."
- id: L5
  question: "How do I show the side setback where the house crosses the property line?"
  uses_precedent: true
  must_not: ["no staff precedent", "no precedent", "approved"]
  abstain: true
  expect_label: [needs_staff]
  gist: "Escalate. How to show a side setback where the building crosses the line (value and notation) is a staff determination; no code section answers it. Must not state what staff have or have not said."
- id: L6a
  question: "Can I build a new detached ADU above a new garage? What setbacks apply?"
  expect_label: [code]
  must_cite: [ch17:17.38.060]
  gist: "New (not converted) ADU: 4 ft side/rear setback; detached height max 18 ft (+2 ft for matching roof pitch); size caps in B.1."
  must_not: ["you can", "approved"]

- id: L6b
  question: "Can I add an ADU above my existing garage by converting it in place?"
  expect_label: [code, needs_staff]
  must_cite: [ch17:17.38.060]
  gist: "Conversion in same location and dimensions: no setback required (B.6.b). Must NOT say 4 ft applies to a same-footprint conversion. Whether a raise or loft qualifies is not answered by the code text."
  must_not: ["you can", "approved"]

- id: L7
  question: "Can I alter the roof over the portion of the building past the property line?"
  uses_precedent: true
  must_not: ["no staff precedent", "no precedent", "approved"]
  abstain: true
  expect_label: [needs_staff]
  gist: "Escalate. Whether the roof over the portion past the property line can be changed is a staff determination; no code section answers it. Must not state what staff have or have not said."
  property_scoped: true
- id: L8
  question: "Can I convert the garage that crosses the property line into an ADU?"
  uses_precedent: true
  expect_label: [code, needs_staff]
  must_cite: [ch17:17.38.060]
  gist: "Code: a conversion in the same location and dimensions needs no side/rear setback (17.38.060.B.6.b). Escalate: whether a garage crossing the property line qualifies, how 17.50.020 (nonconforming structures) interacts, and the encroachment. Must not say yes or no to the conversion and must not state what staff have or have not said."
  must_not: ["no staff precedent", "no precedent", "approved"]
  property_scoped: true

- id: L9
  question: "Can we rebuild the garage shifted fully onto our lot?"
  expect_label: [needs_staff]
  abstain: true
  gist: "No code section or precedent answers this. 2026-11-06 only says there is a path forward for the conversion; details pending. Offer 'Add to staff questions'."
  must_not: ["you can", "approved", "yes", "no"]

- id: L10
  question: "Is 21 Lorita in Zone A, and what is the street setback?"
  expect_label: [code, needs_staff]
  must_cite: [ch17:17.20.040]
  gist: "Street yard min 20 ft in Zone A (17.20.040.A). The zone itself is a property fact not in the vault: say it must come from the property record / zoning map (17.08.020), not confirmed."
  must_not: ["21 Lorita is in Zone A"]

- id: L11
  question: "What should I send before a pre-application meeting with a planner?"
  uses_precedent: true
  must_not: ["no staff precedent", "no precedent", "approved"]
  abstain: true
  expect_label: [needs_staff]
  gist: "Escalate. What to send before a pre-application meeting is a staff process question; no source in the vault covers it. Must not state what staff have or have not said."
- id: L12
  question: "My other property also has a house that crosses the line. Can I replace its roof?"
  uses_precedent: true
  abstain: true
  expect_label: [needs_staff]
  gist: "Escalate. Whether a roof over the portion of a building past the line can be replaced is a staff determination, and any answer for another property would need confirming. No code section answers it. Must not state what staff have or have not said."
  must_not: ["no staff precedent", "no precedent", "approved"]
- id: L13
  question: "Can I exclude the part of my house over the property line from FAR, since 17.90.020 doesn't mention it?"
  uses_precedent: true
  must_not: ["no staff precedent", "no precedent", "approved"]
  expect_label: [code, needs_staff]
  must_cite: [ch17:17.90.020]
  gist: "Show the 17.90.020 floor area text as written; escalate whether and how the portion over the property line is counted. Must not state what staff have or have not said."
